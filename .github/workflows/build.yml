on:
  pull_request:
  push:
    paths: ["src/**", "lib/**", "xmake.lua"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        symbols: [y, n]
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - run: |
          xmake repo -u

      - name: Configure (symbols=${{ matrix.symbols }})
        run: xmake f -a x64 -m release -p windows --symbols=${{ matrix.symbols }} -v -y

      - name: Build
        run: xmake -v -y

      - if: matrix.symbols == 'n'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows-x64-${{ github.sha }}
          path: bin/

      - if: matrix.symbols == 'y'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-symbols-windows-x64-${{ github.sha }}
          path: bin/