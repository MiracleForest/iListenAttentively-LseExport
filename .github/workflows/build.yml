on:
  pull_request:
  push:
    paths: ["src/**", "assets/**", "xmake.lua"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: |
          xmake repo -u

      - name: Build (without symbols)
        run: |
          New-Item -ItemType Directory -Force dist\plain | Out-Null
          xmake f -a x64 -m release -p windows --symbols=n -y
          xmake -v -y
          Move-Item -LiteralPath bin -Destination dist\plain\
        shell: pwsh

      - name: Build (with symbols)
        run: |
          New-Item -ItemType Directory -Force dist\symbols | Out-Null
          xmake f -a x64 -m release -p windows --symbols=y -y
          xmake -v -y
          Move-Item -LiteralPath bin -Destination dist\symbols\
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows-x64-${{ github.sha }}
          path: dist/plain/bin/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-symbols-windows-x64-${{ github.sha }}
          path: dist/symbols/bin/