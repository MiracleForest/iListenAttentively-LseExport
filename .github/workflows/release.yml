on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        symbols: [y, n]
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - run: |
          xmake repo -u

      - name: Configure (symbols=${{ matrix.symbols }})
        run: xmake f -a x64 -m release -p windows --symbols=${{ matrix.symbols }} -v -y

      - name: Build
        run: xmake -v -y

      - if: matrix.symbols == 'n'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows-x64-${{ github.sha }}
          path: bin/

      - if: matrix.symbols == 'y'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-symbols-windows-x64-${{ github.sha }}
          path: bin/

  update-release-notes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v2

      - uses: softprops/action-gh-release@v1
        with:
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows-x64-${{ github.sha }}
          path: artifact

      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-symbols-windows-x64-${{ github.sha }}
          path: artifact-symbols

      - run: |
          cp CHANGELOG.md LICENSE README.md artifact/
          cp CHANGELOG.md LICENSE README.md artifact-symbols/

      - run: |
          zip -r ../${{ github.event.repository.name }}-windows-x64.zip *
        working-directory: artifact

      - run: |
          zip -r ../${{ github.event.repository.name }}-symbols-windows-x64.zip *
        working-directory: artifact-symbols

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ github.event.repository.name }}-windows-x64.zip
            ${{ github.event.repository.name }}-symbols-windows-x64.zip